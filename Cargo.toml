[package]
name = "homenet-watch"
version = "0.6.0"
edition = "2021"
description = "A home network monitor: find devices, watch them, map them, get alerts."

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# SNMP v3 security (RustCrypto)
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
cfb-mode = "0.8"
des = "0.8"
cbc = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Networking_WinHttp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security_WinTrust",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_UI_Shell",
    "Win32_System_Diagnostics_Debug",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

[profile.release]
opt-level = 2

# Local stand-in for the link-opening crate (see vendor/webbrowser).
[patch.crates-io]
webbrowser = { path = "vendor/webbrowser" }

# Everyday builds: a little optimisation keeps fingerprinting and charts quick.
[profile.dev]
opt-level = 1
